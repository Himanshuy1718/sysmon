# Anomaly detector settings. Every number here can be tuned without code changes.
# Values are deliberately short (seconds/minutes) so you can see alerts in a demo;
# production systems use longer windows (e.g. 5 min for CPU, 1 h for leaks).

[detector]
interval_s = 10         # run detection every N seconds
history_s = 900         # how much recent data to load per pass (15 min)
stale_after_s = 60      # ignore hosts with no data for this long (node_down covers them)

# Rule 1: sustained threshold. Fires only if EVERY sample in the window is above
# the threshold, so a 2-second blip doesn't page anyone.
# Resolves only when the recent average drops below resolve_below (HYSTERESIS:
# a gap between "fire" and "clear" levels stops an alert flapping at 89/91/89/91).
[cpu_high]
threshold = 90.0
resolve_below = 80.0
duration_s = 30
severity = "warning"

[mem_high]
threshold = 90.0
resolve_below = 85.0
duration_s = 60
severity = "critical"

# Rule 2: spike detection with a z-score. Compares the last `recent_s` seconds
# with the normal behaviour of the previous `baseline_s` seconds:
#     z = (recent_mean - baseline_mean) / baseline_std
# z >= z_threshold means "far outside normal". min_delta is an absolute floor so
# that 0.1 -> 0.5 on an idle machine (a huge z) doesn't count as a spike.
[spikes]
z_threshold = 4.0
baseline_s = 600
recent_s = 20
min_baseline_samples = 20
severity = "info"

[spikes.min_delta]      # metric = smallest jump worth reporting
cpu_pct = 25.0
disk_write_kbps = 5000.0
disk_read_kbps = 5000.0
net_rx_kbps = 2000.0
net_tx_kbps = 2000.0

# Rule 3: memory leak. Fits a straight line (linear regression) to memory usage
# over the window. A leak = memory rising steadily: positive slope AND a good
# fit (R^2 near 1 means the points lie close to the line, i.e. steady growth,
# not random ups and downs).
[memory_leak]
window_s = 120            # demo-friendly; production: 30-60 min
min_span_s = 90                 # need at least this much data before judging
min_slope_pct_per_min = 0.5     # memory % growth per minute
min_r2 = 0.9
severity = "warning"
